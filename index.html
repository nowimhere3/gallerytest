
      </section>

      <section class="panel gallery-panel">
      <div class="viewer-header">
        <div class="viewer-header-main">
          <h2>Gallery</h2>
          <span id="gallery-count">0 items</span>
        </div>

        <!-- Phase 1 — Gallery Media Navigation. Human-readable 1-based
             numbering ("400" = the 400th item in the current
             Gallery-visible sequence), same set the runtime/filter
             pipeline already produces — no second ordering system. -->
        <div class="gallery-jump-group" role="group" aria-label="Jump to media">
          <span class="toolbar-filter-label">Jump to:</span>
          <input
            id="gallery-jump-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            class="gallery-jump-input"
            aria-label="Media number to jump to"
          />
          <div class="filter-toggle" role="group" aria-label="Jump mode">
            <button
              id="gallery-jump-mode-row-btn"
              id="gallery-jump-mode-find-btn"
              class="filter-btn active"
              type="button"
              aria-pressed="true"
              title="Scroll the Gallery to this item (does not open it in the Viewer)"
            >Media Row</button>
            >Find in Gallery</button>
            <button
              id="gallery-jump-mode-slideshow-btn"
              id="gallery-jump-mode-play-btn"
              class="filter-btn"
              type="button"
              aria-pressed="false"
              title="Load this item into the Viewer and start there"
            >Slideshow</button>
            >Play from here</button>
          </div>
          <button id="gallery-jump-go-btn" class="filter-btn" type="button">Enter</button>
        </div>
      </div>

      <div id="gallery-empty" class="gallery-empty">
        No media loaded yet.
      </div>

      <div id="gallery-grid" class="gallery-grid hidden"></div>
      </section>
      </div>
    </main>
  </div>
